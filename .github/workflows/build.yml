name: Build RoomNote

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # ── macOS — Universal DMG ──────────────────────────────────────────────────
  build-mac:
    name: macOS (Universal DMG)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # ── Bundle Ollama binary ───────────────────────────────────────────────
      - name: Download Ollama binary (Mac)
        run: |
          mkdir -p build/ollama /tmp/ollama-extract
          curl -fsSL "https://github.com/ollama/ollama/releases/latest/download/ollama-darwin.tgz" \
            | tar xz -C /tmp/ollama-extract/
          find /tmp/ollama-extract -maxdepth 2 -name 'ollama' -type f \
            | head -1 | xargs -I{} cp {} build/ollama/ollama
          chmod +x build/ollama/ollama
          ls -lh build/ollama/

      # ── Pre-download LLM model (zero internet after install) ──────────────
      - name: Pre-download Ollama model (llama3.2:3b)
        run: |
          mkdir -p build/ollama-models
          export OLLAMA_MODELS=$PWD/build/ollama-models
          ./build/ollama/ollama serve &
          OLLAMA_PID=$!
          echo "Waiting for Ollama to start..."
          for i in $(seq 1 20); do
            sleep 1
            curl -sf http://localhost:11434/ && break || true
          done
          ./build/ollama/ollama pull llama3.2:3b
          kill $OLLAMA_PID 2>/dev/null || true

      # ── Pre-download Whisper model ────────────────────────────────────────
      - name: Pre-download Whisper model (whisper-base.en)
        run: node scripts/download-whisper.js Xenova/whisper-base.en

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build Mac DMG (Universal)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: npm run build:mac

      - name: List dist output
        run: ls -lh dist/

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: RoomNote-Mac-DMG
          path: dist/*.dmg
          retention-days: 30
          if-no-files-found: warn

      - name: Upload .app (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: RoomNote-Mac-App
          path: dist/mac-universal/RoomNote.app
          retention-days: 30
          if-no-files-found: ignore

  # ── Windows — NSIS Installer ──────────────────────────────────────────────
  build-windows:
    name: Windows (NSIS Installer)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # ── Bundle Ollama binary ───────────────────────────────────────────────
      - name: Download Ollama binary (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\ollama | Out-Null
          $url = "https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\ollama.zip"
          Expand-Archive -Path "$env:TEMP\ollama.zip" -DestinationPath "build\ollama\" -Force
          Get-ChildItem build\ollama\ | Select-Object Name, Length

      # ── Pre-download LLM model ────────────────────────────────────────────
      - name: Pre-download Ollama model (llama3.2:3b)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\ollama-models | Out-Null
          $env:OLLAMA_MODELS = "$PWD\build\ollama-models"
          $srv = Start-Process -FilePath "build\ollama\ollama.exe" `
            -ArgumentList "serve" -PassThru -NoNewWindow
          Write-Host "Waiting for Ollama to start..."
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:11434/" -UseBasicParsing -ErrorAction Stop
              Write-Host "Ollama ready"; break
            } catch {}
          }
          & "build\ollama\ollama.exe" pull llama3.2:3b
          Stop-Process -Id $srv.Id -ErrorAction SilentlyContinue

      # ── Pre-download Whisper model ────────────────────────────────────────
      - name: Pre-download Whisper model (whisper-base.en)
        run: node scripts/download-whisper.js Xenova/whisper-base.en

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: npm run build:win

      - name: List dist output
        shell: pwsh
        run: Get-ChildItem dist\ | Format-Table Name, Length

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: RoomNote-Windows-Installer
          path: dist/*.exe
          retention-days: 30
          if-no-files-found: warn
