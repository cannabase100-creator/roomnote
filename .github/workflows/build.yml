name: Build RoomNote for Mac

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Mac DMG (Universal)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: npm run build:mac

      - name: List dist output
        run: ls -lh dist/

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoomNote-Mac-DMG
          path: dist/*.dmg
          retention-days: 30
          if-no-files-found: warn

      - name: Upload App (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: RoomNote-Mac-App
          path: dist/mac-universal/RoomNote.app
          retention-days: 30
          if-no-files-found: ignore
